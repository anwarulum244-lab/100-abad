name: Render video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libcups2

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Check composition and audio duration
        run: |
          test -f public/100abad.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/100abad.mp3
          npx remotion compositions src/index.ts

      - name: Render preview frames
        run: |
          mkdir -p out
          for frame in 60 1000 2400 4000; do
            npx remotion still src/index.ts Dokumenter100Abad "out/still-${frame}.png" --frame="$frame"
          done

      - name: Render full video
        run: npm run render

      - name: Verify rendered video
        run: |
          test -f out/100-tahun.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 out/100-tahun.mp4

      - name: Upload rendered video and previews
        uses: actions/upload-artifact@v4
        with:
          name: video-100-tahun
          path: out/
          if-no-files-found: error
          retention-days: 7
